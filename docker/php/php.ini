; Ajustes de PHP para el backend del SaaS POS.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120

; OPcache. Como el proyecto se monta por volumen (bind-mount) y el código se
; edita en vivo, validate_timestamps=1 hace que OPcache revalide los archivos por
; mtime en cada request y tome los cambios (incl. bootstrap/cache regenerado) sin
; servir bytecode obsoleto. En una imagen de producción sin volumen, poné
; validate_timestamps=0 para máximo rendimiento.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
